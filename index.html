<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipher — Password Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="card">

  <header class="card__header">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="9" y="18" width="22" height="16" rx="2.5" class="mark__body"/>
      <path d="M13 18 V13 a7 7 0 0 1 14 0 v5" class="mark__shackle"/>
      <circle cx="20" cy="25" r="2.6" class="mark__pin"/>
      <line x1="20" y1="27.2" x2="20" y2="30.5" class="mark__pin"/>
    </svg>
    <div class="titles">
      <h1>Cipher</h1>
      <p class="subtitle">Password forge</p>
    </div>
  </header>

  <div class="mode-switch" role="tablist" aria-label="Generation mode">
    <button type="button" class="mode-btn is-active" id="modeRandomBtn" role="tab" aria-selected="true" aria-controls="panelRandom">Random</button>
    <button type="button" class="mode-btn" id="modePassphraseBtn" role="tab" aria-selected="false" aria-controls="panelPassphrase">Passphrase</button>
    <span class="mode-switch__thumb" aria-hidden="true"></span>
  </div>

  <section class="panel" id="panelRandom">
    <div class="field">
      <div class="field__row">
        <label for="length">Length</label>
        <output id="lengthValue" for="length">16</output>
      </div>
      <input type="range" id="length" min="8" max="64" value="16">
    </div>

    <fieldset class="toggles">
      <legend class="sr-only">Character sets</legend>

      <label class="toggle">
        <input type="checkbox" id="uppercase" checked>
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
        <span class="toggle__label">Uppercase <em>A–Z</em></span>
      </label>

      <label class="toggle">
        <input type="checkbox" id="lowercase" checked>
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
        <span class="toggle__label">Lowercase <em>a–z</em></span>
      </label>

      <label class="toggle">
        <input type="checkbox" id="numbers" checked>
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
        <span class="toggle__label">Numbers <em>0–9</em></span>
      </label>

      <label class="toggle">
        <input type="checkbox" id="symbols" checked>
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
        <span class="toggle__label">Symbols <em>!@#$%</em></span>
      </label>

      <label class="toggle">
        <input type="checkbox" id="excludeAmbiguous">
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
        <span class="toggle__label">Exclude ambiguous <em>0 O 1 l I</em></span>
      </label>
    </fieldset>

    <div class="field">
      <label for="customExclude">Custom exclusions</label>
      <input type="text" id="customExclude" placeholder="e.g. { } ` ~" autocomplete="off" spellcheck="false">
    </div>
  </section>

  <section class="panel" id="panelPassphrase" hidden>
    <div class="field">
      <div class="field__row">
        <label for="wordCount">Words</label>
        <output id="wordCountValue" for="wordCount">5</output>
      </div>
      <input type="range" id="wordCount" min="3" max="8" value="5">
    </div>

    <div class="field">
      <label for="separator">Separator</label>
      <select id="separator">
        <option value="-">hyphen ( - )</option>
        <option value="_">underscore ( _ )</option>
        <option value=".">dot ( . )</option>
        <option value=" ">space</option>
        <option value="">none</option>
      </select>
    </div>

    <fieldset class="toggles">
      <legend class="sr-only">Passphrase options</legend>

      <label class="toggle">
        <input type="checkbox" id="capitalize" checked>
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
        <span class="toggle__label">Capitalize words</span>
      </label>

      <label class="toggle">
        <input type="checkbox" id="appendNumber" checked>
        <span class="toggle__track"><span class="toggle__thumb"></span></span>
        <span class="toggle__label">Append number</span>
      </label>
    </fieldset>
  </section>

  <p class="error" id="errorMsg" hidden></p>

  <button type="button" class="forge-btn" id="generateBtn">
    <span class="forge-btn__label">Forge password</span>
  </button>

  <div class="output">
    <div class="output__display" id="passwordDisplay" aria-live="polite">
      <span class="output__placeholder">Press forge to begin</span>
    </div>
    <button type="button" class="copy-btn" id="copyBtn" aria-label="Copy password" disabled>
      <svg viewBox="0 0 20 20" class="copy-btn__icon" id="copyIcon" aria-hidden="true">
        <rect x="7" y="7" width="10" height="10" rx="1.5"/>
        <path d="M4.5 12.5h-1a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v1"/>
      </svg>
    </button>
  </div>

  <div class="strength" id="strength" hidden>
    <svg class="dial" viewBox="0 0 120 68">
      <path class="dial__track" d="M10 62 A50 50 0 0 1 110 62"/>
      <path class="dial__fill" id="dialFill" d="M10 62 A50 50 0 0 1 110 62"/>
    </svg>
    <div class="strength__info">
      <span class="strength__label" id="strengthLabel">—</span>
      <span class="strength__bits" id="strengthBits">0 bits of entropy</span>
    </div>
  </div>

  <div class="history" id="history" hidden>
    <h2>Recent forges</h2>
    <ul class="history__list" id="historyList"></ul>
  </div>

</main>

<script src="script.js"></script>
</body>
</html>
